# 20260906-03 集成样例：DDL/config 唯一事实源 → 生成全链路提交入库
# 根 = 本文件目录（模块根）；Java 产物落 src/main/java（module），XML 落 src/main/resources/mapper
entity.generator=pojo
entity.module=src/main/java
entity.package=com.example.sample.entity
entity.lombok=true
entity.enums=true

enum.generator=enum
enum.module=src/main/java
enum.package=com.example.sample.enums
enum.lombok=true

po.generator=pojo
po.module=src/main/java
po.package=com.example.sample.po
po.suffix=Po
po.lombok=true

mapper.generator=mybatisMapper
mapper.module=src/main/java
mapper.package=com.example.sample.mapper
mapper.suffix=Mapper
mapper.target=po

xml.generator=mybatisXml
xml.path=src/main/resources/mapper
xml.target=po

repository.generator=repository
repository.module=src/main/java
repository.package=com.example.sample.repository
repository.suffix=Repository
repository.target=entity

repositoryImpl.generator=mybatisRepositoryImpl
repositoryImpl.module=src/main/java
repositoryImpl.package=com.example.sample.repository.impl
repositoryImpl.suffix=RepositoryImpl
repositoryImpl.target=entity
repositoryImpl.mapper=mapper
repositoryImpl.converter=entityConverter
repositoryImpl.di=constructor

entityConverter.generator=converter
entityConverter.module=src/main/java
entityConverter.package=com.example.sample.converter
entityConverter.suffix=Converter
entityConverter.source=po
entityConverter.target=entity

# 命名
naming.table.stripPrefixes=t_
naming.table.stripShardSuffix=true
